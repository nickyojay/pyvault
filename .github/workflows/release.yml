name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: PyVault-linux
            path: dist/PyVault
          - os: windows-latest
            artifact: PyVault-windows
            path: dist/PyVault.exe
          - os: macos-latest
            artifact: PyVault-macos
            path: dist/PyVault.app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller pyvault.spec --clean --noconfirm

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      # --- Windows installer (Inno Setup) ---
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\pyvault.iss

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PyVault-Windows-Installer
          path: packaging/dist_installer/PyVault-Setup.exe
          if-no-files-found: error

  # Publish a GitHub Release with the built assets attached (tag pushes only).
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          mkdir -p release_assets
          cp "artifacts/PyVault-Windows-Installer/PyVault-Setup.exe" "release_assets/PyVault-Setup.exe"
          cp "artifacts/PyVault-windows/PyVault.exe" "release_assets/PyVault-windows.exe"
          cp "artifacts/PyVault-linux/PyVault" "release_assets/PyVault-linux"
          # macOS .app is a bundle (directory) — zip it into a single asset.
          ( cd artifacts/PyVault-macos && zip -q -r -y "$GITHUB_WORKSPACE/release_assets/PyVault-macos.zip" . )
          ls -lh release_assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
