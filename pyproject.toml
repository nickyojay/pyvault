[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyvault"
version = "0.1.0"
description = "A simple, secure, cross-platform personal password manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nick Johnson", email = "njohnson9802@gmail.com" }]
dependencies = [
    "PySide6>=6.7",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "black>=24.0",
    "pyinstaller>=6.0",
]

[project.scripts]
pyvault = "pyvault.cli:main"

[project.gui-scripts]
pyvault-gui = "pyvault.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: allow assert in tests handled per-file below
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101: asserts are how pytest works. S105/S106: test fixtures use literal
# "passwords" that are not real secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py311"]
